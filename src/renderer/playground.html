<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quill · Ribbon Playground</title>
  <link rel="stylesheet" href="./playground/playground.css" />
</head>
<body data-bg="light">
  <main>
    <div class="stage" id="stage">
      <div class="desktop" aria-hidden="true">
        <div class="win"><div class="bar"></div><p>The quick brown fox jumps over the lazy dog. Dictation should feel like thinking out loud.</p></div>
      </div>
      <canvas id="ribbon"></canvas>
    </div>
    <section class="panel">
      <div class="row">
        <button data-act="show">Activate</button>
        <button data-act="process">Process</button>
        <button data-act="success">Insert</button>
        <button data-act="cancel">Cancel</button>
        <button data-act="error">Error</button>
        <button data-act="rest">Rest</button>
      </div>
      <div class="row">
        <label>Voice <input id="voice" type="range" min="0" max="1" step="0.01" value="0" /></label>
        <label><input id="speak" type="checkbox" /> Simulated speech</label>
        <label><input id="mic" type="checkbox" /> Microphone</label>
        <label><input id="reduced" type="checkbox" /> Reduced motion</label>
      </div>
      <div class="row">
        <label>Background
          <select id="bg">
            <option value="light">Light desktop</option>
            <option value="dark">Dark desktop</option>
            <option value="photo">Wallpaper</option>
          </select>
        </label>
        <label>Scale <input id="scale" type="range" min="1" max="4" step="0.5" value="3" /></label>
        <span id="state" class="state">hidden</span>
      </div>
    </section>
  </main>
  <script type="module" src="./playground/main.ts"></script>
</body>
</html>
