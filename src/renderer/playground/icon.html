<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Quill icon</title>
  <style>
    html, body { margin: 0; background: transparent; }
    .tile {
      position: relative; width: 1024px; height: 1024px; border-radius: 230px; overflow: hidden;
      background:
        radial-gradient(90% 70% at 50% 108%, rgba(125, 102, 255, 0.34), transparent 70%),
        radial-gradient(120% 90% at 30% 0%, #ffffff 0%, #f4f2fb 45%, #e6e1f6 100%);
      box-shadow: inset 0 0 0 3px rgba(255,255,255,.65), inset 0 -10px 40px rgba(90, 70, 190, .10);
    }
    .tile.bare { background: transparent; box-shadow: none; }
    canvas { position: absolute; inset: -6%; width: 112%; height: 112%; transform: rotate(-14deg); }
  </style>
</head>
<body>
  <div class="tile" id="tile"><canvas id="c"></canvas></div>
  <script type="module">
    import { Ribbon } from './../ribbon/ribbon.ts';
    const params = new URLSearchParams(location.search);
    if (params.has('bare')) document.getElementById('tile').classList.add('bare');
    const r = new Ribbon(document.getElementById('c'), { viewHeight: 3.3, anchorY: 0.53, supersample: 2, persistent: true, thickness: 1.75, shadow: 0.45 });
    r.manual = true;
    r.show();
    r.advance(1600);
    window.ready = true;
  </script>
</body>
</html>
