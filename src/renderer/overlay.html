<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws://localhost:5199; worker-src blob:; media-src 'self' blob: mediastream:" />
  <title>Quill</title>
  <link rel="stylesheet" href="./overlay/overlay.css" />
</head>
<body>
  <canvas id="ribbon" aria-hidden="true"></canvas>
  <button class="ctrl" id="cancel" aria-label="Cancel dictation" tabindex="-1">
    <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
  </button>
  <button class="ctrl primary" id="stop" aria-label="Finish dictation" tabindex="-1">
    <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><rect x="0.5" y="0.5" width="9" height="9" rx="2.4" fill="currentColor"/></svg>
  </button>
  <div class="status" id="status" role="status" aria-live="polite">
    <span class="dot" aria-hidden="true"></span>
    <span class="label" id="label">Listening</span>
  </div>
  <script type="module" src="./overlay/main.ts"></script>
</body>
</html>
