name: Build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: dtolnay/rust-toolchain@stable
      - name: Native unit tests
        working-directory: native
        run: cargo test -p quill-native

  windows:
    name: Windows installer
    runs-on: windows-latest
    env:
      # bindgen (whisper-rs-sys) needs libclang; the runner image ships LLVM here.
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: MSVC developer environment (cl + ninja on PATH)
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install Vulkan SDK (for the GPU engine)
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.309.0
          install_runtime: false
          cache: true
          stripdown: true
      - name: Build native sidecars (helper, CPU and compatibility engines)
        run: node scripts/build-native.mjs --compat
      - name: Build the Vulkan GPU engine
        # Optional at runtime: without it Quill transcribes on the CPU.
        continue-on-error: true
        run: node scripts/build-native.mjs --vulkan
      - name: Native unit tests
        working-directory: native
        run: cargo test -p quill-native
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Package
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: Quill-Windows
          path: release/*.exe
          if-no-files-found: error
      - name: Fetch a test model and a speech sample
        shell: bash
        run: |
          mkdir -p e2e
          curl -sSfL --retry 3 -o e2e/ggml-tiny.en.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin
          curl -sSfL --retry 3 -o e2e/jfk.wav https://raw.githubusercontent.com/ggml-org/whisper.cpp/master/samples/jfk.wav
      - name: Engine benchmark (standalone, no Electron)
        timeout-minutes: 5
        run: node test/e2e/engine-bench.mjs resources/bin/quill-engine-cpu.exe e2e/ggml-tiny.en.bin e2e/jfk.wav 2
      - name: End-to-end dictation on Windows (hook, engine, paste)
        timeout-minutes: 8
        run: node test/e2e/dictation.e2e.mjs
        env:
          QUILL_MODEL: e2e/ggml-tiny.en.bin
          QUILL_AUDIO: e2e/jfk.wav
          QUILL_SHOTS: e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: |
            e2e/*.png
            e2e/*.log
          if-no-files-found: ignore
